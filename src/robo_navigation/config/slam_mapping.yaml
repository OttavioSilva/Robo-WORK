slam_toolbox:
  ros__parameters:
    # Otimizador usado pelo slam_toolbox.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames e topico reais do robo.
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_slam  # SEM_MAPA_NO_GIRO 23/11: era /scan_front (scan_sem_giro.py corta o giro)
    mode: mapping

    # O mapa sera salvo depois com map_saver_cli.
    use_map_saver: true
    debug_logging: false
    enable_interactive_mode: true

    # O Delta-2D publica aproximadamente 6,4 varreduras por segundo.
    throttle_scans: 1
    minimum_time_interval: 0.15
    max_laser_range: 1.7  # LIMITE_17 (26/11): era 5.8; na frente o chao aparece alem disso (alem = livre, sem parede)
    occupancy_threshold: 0.18  # SLAM_RAPIDO (24/11): era 0.25 (CONFIRMA 23/11; antes 0.1)
    min_pass_through: 3  # CONFIRMA 23/11: era 2 (padrao)
    transform_publish_period: 0.02
    transform_timeout: 0.3
    restamp_tf: true
    tf_buffer_duration: 30.0
    map_update_interval: 1.0  # SLAM_RAPIDO (24/11): era 2.0
    resolution: 0.05
    stack_size_to_use: 40000000

    # Pequenos incrementos sao importantes para o robo lento e sem encoders.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.03
    minimum_travel_heading: 0.035
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 5.8
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # Fechamento de loop corrige o mapa ao retornar a uma area conhecida.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Parametros de correlacao do scan matcher.
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 0.1  # SLAM_IMU_FORTE 23/11: era 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.0873  # SLAM_IMU_FORTE 23/11: era 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.2  # SLAM_IMU_FORTE 23/11: era 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
